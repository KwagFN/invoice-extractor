[project]
name = "invoice-extractor"
version = "0.1.0"
description = "Extracts invoice data from PDFs with AI and checks that the numbers add up"
readme = "README.md"
authors = [
    { name = "Francisco Netto", email = "franciscojdsnetto@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.34.0",
    "pydantic>=2.14.2",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
]

[project.scripts]
invoice-extractor = "invoice_extractor:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
