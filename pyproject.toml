[project]
name = "invoice-extractor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Francisco Netto", email = "franciscojdsnetto@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.2",
]

[project.scripts]
invoice-extractor = "invoice_extractor:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]